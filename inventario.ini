# Los cinco contenedores comparten la IP local del host.
# Cada uno tiene un puerto SSH diferente publicado por Docker Compose.
[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2221
servidor2 ansible_host=127.0.0.1 ansible_port=2232
servidor3 ansible_host=127.0.0.1 ansible_port=2223
servidor4 ansible_host=127.0.0.1 ansible_port=2224
servidor5 ansible_host=127.0.0.1 ansible_port=2225

[servidores:vars]
ansible_connection=ssh
ansible_user=ansible
ansible_password=ansible
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
