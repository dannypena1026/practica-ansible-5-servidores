---
- name: Automatizar la configuracion de cinco servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar la cache de paquetes APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: true
        shell: /bin/bash

    - name: Crear la carpeta app para el usuario itla
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear hola.txt en la carpeta app
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: "Hola Mundo desde {{ inventory_hostname }}. Configurado automaticamente con Ansible.\n"
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
